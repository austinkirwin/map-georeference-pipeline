name: Map intake
description: Register a historical map for georeferencing review.
title: "[Map intake]: "
labels: ["map:intake", "georeference:needs-landmarks"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for externally hosted maps or when a repository intake folder has not yet been created.

        To create a map-backed Issue automatically, add maps/inbox/<map-id>/map.json and a small review image to the default branch.

        Attach a small review image or PDF only when it may be shared with everyone allowed to view this Issue. Do not upload restricted sources, credentials, or sensitive locations. A reviewer can instead download an authorized file and open it locally in the Render workspace; that browser-local copy is not uploaded.
  - type: input
    id: map-id
    attributes:
      label: Map identifier
      description: Use lowercase letters, numbers, and hyphens only.
      placeholder: champaign-zoning-1930-sheet-01
    validations:
      required: true
  - type: input
    id: map-date
    attributes:
      label: Map date
      description: Use ISO date format when known.
      placeholder: 1930-01-01
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: Place shown on the map
      placeholder: Champaign, Illinois
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source and rights
      description: Include the archive, stable source URL, sheet or page locator, access date, and known rights information.
    validations:
      required: true
  - type: input
    id: map-file
    attributes:
      label: Source or storage location
      description: Paste a durable source location available to the intended reviewers. You may attach a small authorized review image or PDF only when it may be shared with everyone able to view this Issue; large scans belong in approved storage.
    validations:
      required: true
  - type: textarea
    id: landmarks
    attributes:
      label: Candidate landmarks
      description: List durable features that may match a modern reference, such as road intersections, rail crossings, bridges, or civic buildings.
      placeholder: |
        - Main Street and First Avenue
        - River bridge at the south edge of the sheet
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Intake acknowledgements
      options:
        - label: I have recorded the source and rights information to the best of my knowledge.
          required: true
        - label: I confirm that any submitted source URL, attachment, or repository review copy may be shared with authorized repository collaborators.
          required: true
        - label: I understand this Issue is a research record, not a legal zoning determination.
          required: true
