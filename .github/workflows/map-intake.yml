name: Create map-intake Issues

on:
  push:
    paths:
      - "maps/inbox/**/map.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-intake-issues:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Create one Issue for each new map manifest
        uses: actions/github-script@v7
        env:
          PAGES_REVIEW_URL: ${{ vars.PAGES_REVIEW_URL }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const labels = [
              { name: "map:intake", color: "0E8A16", description: "A map awaiting georeferencing intake." },
              { name: "georeference:needs-landmarks", color: "FBCA04", description: "Landmark selection is needed." }
            ];

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }

            for (const label of labels) await ensureLabel(label);

            function defaultPagesReviewUrl() {
              const pagesHost = owner.toLowerCase() + ".github.io";
              const isUserOrOrganizationSite = repo.toLowerCase() === pagesHost;
              return (
                "https://" +
                pagesHost +
                (isUserOrOrganizationSite ? "/" : "/" + encodeURIComponent(repo) + "/")
              );
            }

            function parsePagesReviewBaseUrl() {
              const configuredValue = (process.env.PAGES_REVIEW_URL || "").trim();
              const value = configuredValue || defaultPagesReviewUrl();
              try {
                const url = new URL(value);
                if (url.protocol !== "https:" || url.username || url.password) {
                  throw new Error("URL must use HTTPS without embedded credentials");
                }
                return url;
              } catch (error) {
                core.warning(
                  "PAGES_REVIEW_URL is not a safe HTTPS URL; using the repository's default Pages URL instead (" +
                    (error instanceof Error ? error.message : "unknown error") +
                    ")."
                );
                return new URL(defaultPagesReviewUrl());
              }
            }

            const pagesReviewBaseUrl = parsePagesReviewBaseUrl();

            function pagesReviewUrl(mapId, issueNumber) {
              const url = new URL(pagesReviewBaseUrl);
              url.hash = "";
              url.searchParams.set("map", mapId);
              url.searchParams.set("issue", issueNumber);
              return url.toString();
            }

            let changedFiles = [];
            const before = context.payload.before;
            if (before && !/^0+$/.test(before)) {
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: before, head: context.sha, per_page: 100
              });
              changedFiles = comparison.data.files || [];
            } else {
              const commit = await github.rest.repos.getCommit({
                owner, repo, ref: context.sha
              });
              changedFiles = commit.data.files || [];
            }

            const pattern = /^maps\/inbox\/([a-z0-9][a-z0-9-]*)\/map\.json$/;
            const mapIds = new Set(
              changedFiles
                .filter((file) => file.status !== "removed")
                .map((file) => pattern.exec(file.filename))
                .filter(Boolean)
                .map((match) => match[1])
            );

            if (mapIds.size === 0) {
              core.notice("No map.json intake files were added or updated.");
              return;
            }

            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "all", per_page: 100
            });

            for (const mapId of mapIds) {
              const manifestPath = "maps/inbox/" + mapId + "/map.json";
              const marker = "<!-- map-intake:" + manifestPath + " -->";
              const exists = existingIssues.some(
                (issue) => !issue.pull_request && (issue.body || "").includes(marker)
              );
              if (exists) {
                core.info("An intake Issue already exists for " + manifestPath + ".");
                continue;
              }

              const rootUrl = "https://github.com/" + owner + "/" + repo;
              const manifestUrl = rootUrl + "/blob/" + context.sha + "/" + manifestPath;
              const issueNumberToken = "__ISSUE_NUMBER__";
              const reviewWorkspaceUrl = pagesReviewUrl(mapId, issueNumberToken);
              const body = [
                marker,
                "# Map intake: " + mapId,
                "",
                "This Issue is the review record for the map intake.",
                "",
                "## Files",
                "- [Map intake manifest](" + manifestUrl + ")",
                "",
                "## Landmark selection",
                "1. [Open the GitHub Pages landmark picker](" + reviewWorkspaceUrl + ").",
                "2. If the Pages site is still deploying, wait a few minutes and reload it. The picker opens `maps/inbox/" + mapId + "/` and Issue #" + issueNumberToken + ".",
                "3. If the review image must stay outside the repository, open the picker and choose **Open local review copy** after downloading an authorized PNG, JPEG, or WebP. It is not uploaded or committed.",
                "4. Pair durable historic and modern landmarks.",
                "5. Select **Done — review overlay**, then document the review and any landmark details manually in this Issue.",
                "",
                "## Review checklist",
                "- [ ] Verify source information and map date.",
                "- [ ] Confirm that the review copy may be served by GitHub Pages.",
                "- [ ] Add fit points distributed across the sheet.",
                "- [ ] Add independent check points.",
                "- [ ] Review residuals and overlay alignment.",
                "- [ ] Add or link the reviewed manifest under maps/manifests.",
                "",
                "The picker is a research tool. It does not make a legal zoning determination."
              ].join("\n");

              const issue = await github.rest.issues.create({
                owner,
                repo,
                title: "Map intake: " + mapId,
                body,
                labels: labels.map((label) => label.name)
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.data.number,
                body: body.split(issueNumberToken).join(String(issue.data.number))
              });
              core.notice("Created Issue #" + issue.data.number + " for " + mapId + ".");
            }
